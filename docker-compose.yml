services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ecommerce_app
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    depends_on:
      - mysql

  webserver:
    image: nginx:alpine
    container_name: ecommerce_nginx
    ports:
      - "8000:80"
    volumes:
      - ./:/var/www/html
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app

  mysql:
    image: mysql:5.7
    container_name: ecommerce_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: jalal
      MYSQL_DATABASE: ecommerce
      MYSQL_USER: jalal
      MYSQL_PASSWORD: jalal
    ports:
      - "3306:3306"

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: ecommerce_phpmyadmin
    restart: always
    ports:
      - "8080:80"
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      MYSQL_ROOT_PASSWORD: jalal
    depends_on:
      - mysql
